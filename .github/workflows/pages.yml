name: Deploy course to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare lesson
        run: |
          mkdir -p _site
          cp index.html styles.css script.js _site/
          mkdir -p _site/bp02
          cp bp02/index.html bp02/styles.css bp02/script.js _site/bp02/
          mkdir -p _site/bp03
          cp bp03/index.html bp03/styles.css bp03/script.js _site/bp03/
          mkdir -p _site/bp04
          cp bp04/index.html bp04/styles.css bp04/script.js _site/bp04/
          mkdir -p _site/bp05
          cp bp05/index.html bp05/styles.css bp05/script.js _site/bp05/
          mkdir -p _site/m02-l01
          cp m02-l01/index.html m02-l01/styles.css m02-l01/script.js _site/m02-l01/
          mkdir -p _site/m02-l02
          cp m02-l02/index.html m02-l02/styles.css m02-l02/script.js _site/m02-l02/
          mkdir -p _site/m02-l03
          cp m02-l03/index.html m02-l03/styles.css m02-l03/script.js _site/m02-l03/
          mkdir -p _site/m02-l04
          cp m02-l04/index.html m02-l04/styles.css m02-l04/script.js _site/m02-l04/
          mkdir -p _site/m02-l05
          cp m02-l05/index.html m02-l05/styles.css m02-l05/script.js _site/m02-l05/
          mkdir -p _site/m02-l06
          cp m02-l06/index.html m02-l06/styles.css m02-l06/script.js _site/m02-l06/
          mkdir -p _site/m03-l01
          cp m03-l01/index.html m03-l01/styles.css m03-l01/script.js _site/m03-l01/
          mkdir -p _site/m03-l02
          cp m03-l02/index.html m03-l02/styles.css m03-l02/script.js _site/m03-l02/
          mkdir -p _site/m03-l03
          cp m03-l03/index.html m03-l03/styles.css m03-l03/script.js _site/m03-l03/
          mkdir -p _site/m03-l04
          cp m03-l04/index.html m03-l04/styles.css m03-l04/script.js _site/m03-l04/
          mkdir -p _site/m03-l05
          cp m03-l05/index.html m03-l05/styles.css m03-l05/script.js _site/m03-l05/
          mkdir -p _site/m03-l06
          cp m03-l06/index.html m03-l06/styles.css m03-l06/script.js _site/m03-l06/
          mkdir -p _site/m04-l01
          cp m04-l01/index.html m04-l01/styles.css m04-l01/script.js _site/m04-l01/
          mkdir -p _site/m04-l02
          cp m04-l02/index.html m04-l02/styles.css m04-l02/script.js _site/m04-l02/
          mkdir -p _site/m04-l03
          cp m04-l03/index.html m04-l03/styles.css m04-l03/script.js _site/m04-l03/
          mkdir -p _site/m04-l04
          cp m04-l04/index.html m04-l04/styles.css m04-l04/script.js _site/m04-l04/
          mkdir -p _site/m04-l05
          cp m04-l05/index.html m04-l05/styles.css m04-l05/script.js _site/m04-l05/
          mkdir -p _site/m04-l06
          cp m04-l06/index.html m04-l06/styles.css m04-l06/script.js _site/m04-l06/
          mkdir -p _site/m06-l01
          cp m06-l01/index.html m06-l01/styles.css m06-l01/script.js _site/m06-l01/
          mkdir -p _site/m06-l02
          cp m06-l02/index.html m06-l02/styles.css m06-l02/script.js _site/m06-l02/
          mkdir -p _site/m06-l03
          cp m06-l03/index.html m06-l03/styles.css m06-l03/script.js _site/m06-l03/
          mkdir -p _site/m06-l04
          cp m06-l04/index.html m06-l04/styles.css m06-l04/script.js _site/m06-l04/
          mkdir -p _site/m06-l05
          cp m06-l05/index.html m06-l05/styles.css m06-l05/script.js _site/m06-l05/
          mkdir -p _site/m06-l06
          cp m06-l06/index.html m06-l06/styles.css m06-l06/script.js _site/m06-l06/
          mkdir -p _site/m06-l07
          cp m06-l07/index.html m06-l07/styles.css m06-l07/script.js _site/m06-l07/
          mkdir -p _site/m06-l08
          cp m06-l08/index.html m06-l08/styles.css m06-l08/script.js _site/m06-l08/
          mkdir -p _site/m05-l01
          cp m05-l01/index.html m05-l01/styles.css m05-l01/script.js _site/m05-l01/
          mkdir -p _site/m05-l02
          cp m05-l02/index.html m05-l02/styles.css m05-l02/script.js _site/m05-l02/
          mkdir -p _site/m05-l03
          cp m05-l03/index.html m05-l03/styles.css m05-l03/script.js _site/m05-l03/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}


# Release includes the complete MV-08 lesson and its assets.
