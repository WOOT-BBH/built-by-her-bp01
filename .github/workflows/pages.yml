name: Deploy course to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare lesson
        run: |
          mkdir -p _site
          cp index.html styles.css script.js _site/
          mkdir -p _site/bp02
          cp bp02/index.html bp02/styles.css bp02/script.js _site/bp02/
          mkdir -p _site/bp03
          cp bp03/index.html bp03/styles.css bp03/script.js _site/bp03/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
